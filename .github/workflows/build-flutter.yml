name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID'
        required: true
        type: string
      userId:
        description: 'User ID'
        required: false
        type: string
      payload:
        description: 'JSON payload'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: payload
        run: |
          echo '${{ inputs.payload }}' > payload.json
          URL=$(jq -r '.url // empty' payload.json)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "jobId=${{ inputs.jobId }}" >> $GITHUB_OUTPUT

      - name: Download source ZIP
        run: |
          curl -L -o source.zip "${{ steps.payload.outputs.url }}"
          mkdir -p project
          unzip -q source.zip -d project || true
          ls -la project/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Build APK
        run: |
          cd project
          # Cari folder yang berisi pubspec.yaml
          if [ -f "pubspec.yaml" ]; then
            PROJ_DIR="."
          else
            PROJ_DIR=$(find . -name "pubspec.yaml" | head -1 | xargs dirname)
          fi
          echo "Project dir: $PROJ_DIR"
          cd "$PROJ_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/**/*.apk
          if-no-files-found: warn
